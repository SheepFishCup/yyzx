services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: yyzx_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: yyzx
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./yyzx.sql:/docker-entrypoint-initdb.d/yyzx.sql
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
    networks:
      - yyzx_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  # Redis 缓存服务
  redis-master:
    image: redis:7-alpine
    container_name: yyzx_redis_master
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    command: redis-server --port 6379 --requirepass yourpassword --appendonly yes
    networks:
      - yyzx_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "yourpassword", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    
  redis-slave1:
    image: redis:7-alpine
    container_name: yyzx_redis_slave1
    ports:
      - "6380:6379"
    volumes:
      - redis_slave1_data:/data
    command: redis-server --port 6379 --slaveof redis-master 6379 --masterauth yourpassword --requirepass yourpassword --appendonly yes
    depends_on:
      - redis-master
    networks:
      - yyzx_network
    restart: always

  redis-slave2:
    image: redis:7-alpine
    container_name: yyzx_redis_slave2
    ports:
      - "6381:6379"
    volumes:
      - redis_slave2_data:/data
    command: redis-server --port 6379 --slaveof redis-master 6379 --masterauth yourpassword --requirepass yourpassword --appendonly yes
    depends_on:
      - redis-master
    networks:
      - yyzx_network
    restart: always

  redis-sentinel1:
    image: redis:7-alpine
    container_name: yyzx_redis_sentinel1
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
    networks:
      - yyzx_network
    restart: always

  redis-sentinel2:
    image: redis:7-alpine
    container_name: yyzx_redis_sentinel2
    ports:
      - "26380:26379"
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
    networks:
      - yyzx_network
    restart: always

  redis-sentinel3:
    image: redis:7-alpine
    container_name: yyzx_redis_sentinel3
    ports:
      - "26381:26379"
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
    networks:
      - yyzx_network
    restart: always  

  # RabbitMQ 消息队列服务
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: yyzx_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - yyzx_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # 你的 Spring Boot 应用
  yyzx_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yyzx_backend
    depends_on:
      mysql:
        condition: service_healthy
      redis-sentinel1:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "9999:9999"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yyzx?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_REDIS_SENTINEL_MASTER: mymaster
      SPRING_REDIS_SENTINEL_NODES: redis-sentinel1:26379,redis-sentinel2:26379,redis-sentinel3:26379
      SPRING_REDIS_PASSWORD: yourpassword
      SPRING_RABBITMQ_HOST: rabbitmq
      JAVA_OPTS: "-Xms512m -Xmx1024m -Duser.timezone=GMT+8"
    volumes:
      - ./logs:/app/logs
    networks:
      - yyzx_network
    restart: always

volumes:
  mysql_data:
  redis_master_data:
  redis_slave1_data:
  redis_slave2_data:
  rabbitmq_data:

networks:
  yyzx_network:
    driver: bridge
