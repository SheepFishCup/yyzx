server:
  port: 9999
  servlet:
    context-path: /yyzx

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nursinghome?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: 123456

# springfox swagger 不支持spring2.7以上的版本
# springfox使用的匹配路径默认是ant_path_matcher，但是spring2.7以上版本默认是path_matching

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
# 日期和时间的配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# mybatis-plus配置
mybatis-plus:
  configuration:
    # 打印mybatis的日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # mapper xml的映射位置
  mapper-locations: classpath:/mapper/*.xml
  #项目实体包路径的位置
  type-aliases-package: com.cqupt.pojo,com.cqupt.vo,com.cqupt.dto