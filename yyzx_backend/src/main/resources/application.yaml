server:
  port: 9999
  servlet:
    context-path: /yyzx

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nursinghome?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: 123456

# springfox swagger 不支持spring2.7以上的版本
# springfox使用的匹配路径默认是ant_path_matcher，但是spring2.7以上版本默认是path_matching
  # Redis配置
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8 # 最大空闲连接数
        min-idle: 5 # 最小空闲连接数
        max-wait: 3000ms
  mvc: # 解决spring2.7以上版本匹配路径问题
    pathmatch:
      matching-strategy: ant_path_matcher
# 日期和时间的配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# mybatis-plus配置
mybatis-plus:
  configuration:
    # 打印mybatis的日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # mapper xml的映射位置
  mapper-locations: classpath:/mapper/*.xml
  #项目实体包路径的位置
  type-aliases-package: com.cqupt.pojo,com.cqupt.vo,com.cqupt.dto

yyzx:
  jwt:
    user-secret: cqupt123456  # 加密密钥
    user-expire: 7200000  # token有效时长
    user-header: token # header名称
    patient-secret: cqupt123456
    patient-expire: 7200000
    patient-header: token