server:
  port: 9999
  servlet:
    context-path: /yyzx
  tomcat:
    mbeanregistry:
      enabled: true

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yyzx?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/yyzx?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456

      name: yyzx-druid                    # 连接池名称（便于监控）
      initial-size: 10                    # 初始连接数（与 min-idle 一致）
      min-idle: 10                        # 最小空闲连接数
      max-active: 25                      # 最大连接数
      max-wait: 3000                      # 获取连接超时时间(ms)

      # 防内存泄漏（关键配置）
      remove-abandoned: true              # 开启连接泄漏回收
      remove-abandoned-timeout: 300       # 连接泄漏超时时间(秒)
      log-abandoned: true                 # 记录泄漏日志

      # 连接检测
      time-between-eviction-runs-millis: 60000   # 检测间隔(ms)
      min-evictable-idle-time-millis: 300000     # 空闲连接存活时间(ms)
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

      # 统计过滤器（Druid 1.2.x 语法）
      filter:
        stat:
          enabled: true
          db-type: mysql
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true

      use-global-data-source-stat: true
  # springfox swagger 不支持spring2.7以上的版本
# springfox使用的匹配路径默认是ant_path_matcher，但是spring2.7以上版本默认是path_matching
  # Redis配置
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8 # 最大空闲连接数
        min-idle: 5 # 最小空闲连接数
        max-wait: 3000ms

  mvc: # 解决spring2.7以上版本匹配路径问题
    pathmatch:
      matching-strategy: ant_path_matcher
# 日期和时间的配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  mail:
    host: smtp.qq.com  # 邮箱服务器（QQ邮箱）
    port: 587
    username: 2855733759@qq.com  # 你的邮箱
    password: ppugcbdoifvdddch  # 邮箱授权码（不是登录密码）
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Quartz 定时任务配置（在 spring 下）
  quartz:
    job-store-type: memory
    properties:
      org:
        quartz:
          scheduler:
            instanceName: wantedScheduler
            instanceId: AUTO
          jobStore:
            class: org.quartz.simpl.RAMJobStore
            misfireThreshold: 60000
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true
    # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认模式
        concurrency: 5  # 初始消费者数量
        max-concurrency: 10  # 最大消费者数量
        prefetch: 3  # 每次从数据库中获取的记录数量
# mybatis-plus配置
mybatis-plus:
  configuration:
    # 打印mybatis的日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # mapper xml的映射位置
  mapper-locations: classpath:/mapper/*.xml
  #项目实体包路径的位置
  type-aliases-package: com.cqupt.pojo,com.cqupt.vo,com.cqupt.dto

yyzx:
