server:
  port: 8082
  servlet:
    context-path: /yyzx

spring:
  application:
    name: yyzx-customer
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/yyzx?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      initial-size: 10
      min-idle: 10
      max-active: 25
      max-wait: 3000
      remove-abandoned: true
      remove-abandoned-timeout: 300
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
  redis:
    host: localhost
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 5
        max-wait: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 10
        prefetch: 3
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
      config:
        server-addr: localhost:8848
        namespace: public
        file-extension: yaml
        enabled: false

    # Sentinel 流量防卫兵
    sentinel:
      transport:
        dashboard: localhost:8090
        port: 8720
      eager: true

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.cqupt.pojo,com.cqupt.vo,com.cqupt.dto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

yyzx:
  jwt:
    user-secret: cqupt123456
    user-expire: 7200000  # 2h
    user-token-name: token
  wechat:
    appid: your-appid
    secret: your-secret
    mchid: your-mchid
  internal-token: yyzx-internal-secret-2026

dingtalk:
  robot:
    webhook: https://oapi.dingtalk.com/robot/send?access_token=xxx
    secret: xxx

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-N/A}] %-5level %logger{50} - %msg%n"
  level:
    com.cqupt.customer: DEBUG

skywalking:
  enable: true

# ==================== Seata 分布式事务 ====================
seata:
  enabled: false              # 本地开发默认关闭；接入 Seata Server 后改为 true
  tx-service-group: yyzx-tx-group
  service:
    vgroup-mapping:
      yyzx-tx-group: default
    grouplist:
      default: localhost:8091
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: public
      group: SEATA_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: public
      group: SEATA_GROUP
  data-source-proxy-mode: AT   # AT 模式代理数据源

