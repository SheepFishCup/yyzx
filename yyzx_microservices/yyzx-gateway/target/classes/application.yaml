server:
  port: 8080

spring:
  application:
    name: yyzx-gateway
  # Redis 配置（JWT token 校验）
  redis:
    host: localhost
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 5
        max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
      config:
        server-addr: localhost:8848
        namespace: public
        file-extension: yaml
        enabled: false
    sentinel:
      transport:
        dashboard: localhost:8090
        port: 8719
      eager: true
      scg:
        fallback:
          mode: response
          response-body: '{"flag":false,"message":"请求过于频繁，请稍后重试","data":null}'
          response-status: 429
          content-type: application/json
    gateway:
      discovery:
        locator:
          enabled: false  # 不使用自动路由发现，手动配置
          lower-case-service-id: true
      # ==================== 路由配置 ====================
      routes:
        # ---- 认证服务 (yyzx-auth:8081) ----
        - id: auth-admin
          uri: lb://yyzx-auth
          predicates:
            - Path=/yyzx/admin/**
        - id: auth-role
          uri: lb://yyzx-auth
          predicates:
            - Path=/yyzx/role/**
        - id: auth-menu
          uri: lb://yyzx-auth
          predicates:
            - Path=/yyzx/menu/**
        - id: auth-rolemenu
          uri: lb://yyzx-auth
          predicates:
            - Path=/yyzx/rolemenu/**

        # ---- 客户服务 (yyzx-customer:8082) ----
        - id: customer-main
          uri: lb://yyzx-customer
          predicates:
            - Path=/yyzx/customer/**
        - id: customer-preference
          uri: lb://yyzx-customer
          predicates:
            - Path=/yyzx/customerpreference/**
        - id: customer-nurse-item
          uri: lb://yyzx-customer
          predicates:
            - Path=/yyzx/customernurseitem/**
        - id: customer-patient
          uri: lb://yyzx-customer
          predicates:
            - Path=/yyzx/patient/**

        # ---- 床位服务 (yyzx-bed:8083) ----
        - id: bed-main
          uri: lb://yyzx-bed
          predicates:
            - Path=/yyzx/bed/**
        - id: bed-details
          uri: lb://yyzx-bed
          predicates:
            - Path=/yyzx/beddetails/**
        - id: bed-room
          uri: lb://yyzx-bed
          predicates:
            - Path=/yyzx/room/**

        # ---- 护理服务 (yyzx-nursing:8084) ----
        - id: nursing-content
          uri: lb://yyzx-nursing
          predicates:
            - Path=/yyzx/nursecontent/**
        - id: nursing-level
          uri: lb://yyzx-nursing
          predicates:
            - Path=/yyzx/nurselevel/**
        - id: nursing-level-item
          uri: lb://yyzx-nursing
          predicates:
            - Path=/yyzx/nurselevelitem/**
        - id: nursing-record
          uri: lb://yyzx-nursing
          predicates:
            - Path=/yyzx/nurserecord/**

        # ---- 出入管理服务 (yyzx-checkinout:8085) ----
        - id: checkinout-backdown
          uri: lb://yyzx-checkinout
          predicates:
            - Path=/yyzx/backdown/**
        - id: checkinout-outward
          uri: lb://yyzx-checkinout
          predicates:
            - Path=/yyzx/outward/**

        # ---- 膳食服务 (yyzx-meal:8086) ----
        - id: meal-food
          uri: lb://yyzx-meal
          predicates:
            - Path=/yyzx/food/**
        - id: meal-plan
          uri: lb://yyzx-meal
          predicates:
            - Path=/yyzx/meal/**

        # ---- 报表服务 (yyzx-report:8088) ----
        - id: report
          uri: lb://yyzx-report
          predicates:
            - Path=/yyzx/report/**

      # 全局默认过滤器
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - StripPrefix=0

# JWT 配置（白名单在 AuthProperties.java 中维护，此处仅覆盖 jwt-secret）
yyzx:
  gateway:
    jwt-secret: cqupt123456

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-N/A}] %-5level %logger{50} - %msg%n"
  level:
    com.cqupt.gateway: DEBUG
    com.alibaba.csp.sentinel: INFO

# ==================== SkyWalking 配置 ====================
# 注: Agent 核心参数（service_name, backend_service）通过 JVM -D 参数传入
# 此处仅配置应用层可见参数
skywalking:
  enable: true
