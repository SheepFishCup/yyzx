server:
  port: 8084
  servlet:
    context-path: /yyzx

spring:
  application:
    name: yyzx-nursing
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/yyzx?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      initial-size: 10
      min-idle: 10
      max-active: 25
      max-wait: 3000
      remove-abandoned: true
      remove-abandoned-timeout: 300
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
  redis:
    host: localhost
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 5
        max-wait: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
      config:
        server-addr: localhost:8848
        namespace: public
        file-extension: yaml
        enabled: false

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.cqupt.pojo,com.cqupt.vo,com.cqupt.dto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

yyzx:
  jwt:
    user-secret: cqupt123456
    user-expire: 7200000  # 2h
    user-token-name: token

knife4j:
  enable: true
  setting:
    language: zh_cn
