server:
  port: 8084
  servlet:
    context-path: /yyzx

spring:
  application:
    name: yyzx-nursing
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/yyzx?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${SPRING_DATASOURCE_USERNAME:root}
      password: ${SPRING_DATASOURCE_PASSWORD:123456}
      initial-size: 10
      min-idle: 10
      max-active: 25
      max-wait: 3000
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
  redis:
    host: ${SPRING_REDIS_HOST:redis-master}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:yourpassword}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 5
        max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
        enabled: false

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.cqupt.pojo,com.cqupt.vo,com.cqupt.dto

yyzx:
  jwt:
    user-secret: ${JWT_SECRET:cqupt123456}
    user-ttl: 7200000
    user-token-name: token
