server:
  port: 8081
  servlet:
    context-path: /yyzx

spring:
  application:
    name: yyzx-auth
  # 数据源配置
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/yyzx?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      initial-size: 10
      min-idle: 10
      max-active: 25
      max-wait: 3000
      remove-abandoned: true
      remove-abandoned-timeout: 300
      log-abandoned: true
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 5
        max-wait: 3000ms
  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 10
        prefetch: 3
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # MVC 配置
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: 2855733759@qq.com
    password: your-mail-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
      config:
        server-addr: localhost:8848
        namespace: public
        file-extension: yaml
        enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.cqupt.pojo,com.cqupt.vo,com.cqupt.dto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
yyzx:
  jwt:
    user-secret: cqupt123456
    user-expire: 7200000   # 2小时 (milliseconds)
    user-token-name: token
  wechat:
    appid: your-appid
    secret: your-secret
    mchid: your-mchid
  internal-token: yyzx-internal-secret-2026

# 钉钉机器人配置
dingtalk:
  robot:
    webhook: https://oapi.dingtalk.com/robot/send?access_token=xxx
    secret: xxx

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-N/A}] %-5level %logger{50} - %msg%n"
  level:
    com.cqupt.auth: DEBUG

skywalking:
  enable: true
