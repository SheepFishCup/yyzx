# ============================================================
# Nacos 配置 — yyzx-auth (认证服务)
# ============================================================
server:
  port: 8081
  servlet:
    context-path: /yyzx

spring:
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:2855733759@qq.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

dingtalk:
  robot:
    webhook: ${DINGTALK_WEBHOOK:}
    secret: ${DINGTALK_SECRET:}
